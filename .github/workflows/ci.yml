# GitHub Actions equivalent of .gitlab-ci.yml
name: CI

on:
  push:
  pull_request:

env:
  MAVEN_OPTS: "-Xms256m -Xmx512m"

jobs:
  # Compile program based on pom.xml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # match the Java version in your pom.xml
          cache: maven
      - run: mvn -B compile

  # Test program based on pom.xml
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  # Package program based on pom.xml (main branch only)
  package:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: game-of-life-refactored
          path: target/game-of-life-refactored-1.0-SNAPSHOT.jar

